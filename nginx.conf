server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # The service worker, its registration script, and the manifest control
    # PWA update behavior — browsers must revalidate these every time, or a
    # deploy's new sw.js can stay masked behind a cached copy indefinitely.
    location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # vite's content-hashed filenames (assets/*-<hash>.ext) never change
    # contents under a given URL, so they're safe to cache indefinitely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback for client-side routes (e.g. /category/1) — anything that
    # isn't a real file falls back to index.html. /api and /uploads never
    # reach this container: the k8s Ingress routes those straight to the
    # backend service.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
